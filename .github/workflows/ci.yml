name: CI
on:
  push:
    branches: [main, devin/initial-harness]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint-tasks -- --all
      - run: node dist/cli.js lint --all
      - run: node dist/cli.js run --all --driver mock --ci --trials 3
      - run: node dist/cli.js build-site --results results/ --out dist-site/ --allow-mock-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mock-preview-not-benchmark-results
          path: dist-site/
          if-no-files-found: error
