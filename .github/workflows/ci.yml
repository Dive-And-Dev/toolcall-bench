name: CI
on:
  push:
    branches: [main, devin/initial-harness]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint-tasks -- --all
      - run: node dist/cli.js lint --all
      - run: node dist/cli.js run --all --driver mock --ci --trials 3
      - run: node dist/cli.js build-site --results results/ --out dist-site/ --allow-mock-preview
      - uses: actions/upload-artifact@v4
        with:
          name: mock-preview-not-benchmark-results
          path: dist-site/
          if-no-files-found: error
